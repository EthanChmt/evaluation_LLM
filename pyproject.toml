[project]
name = "eval-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "EthanChmt", email = "ethan.chaumeret@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.16.0",
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "langchain==0.3.23",
    "langchain-community==0.3.21",
    "langchain-groq>=0.3.8",
    "langchain-huggingface>=0.3.1",
    "langchain-mistralai==0.2.12",
    "langsmith>=0.3.45",
    "logfire>=0.5.0",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow>=9.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai-slim[mistral]>=0.0.1",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "python-dotenv==1.1.0",
    "ragas>=0.2.0",
    "requests==2.32.3",
    "streamlit==1.44.1",
    "streamlit-feedback==0.1.4",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
eval-llm = "eval_llm:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
